name: KAN-REC CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # -- Gate 1: no credentials may ever reach the repository ------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: catches secrets in old commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -- Gate 2: tests ---------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: secret-scan

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=kanrec --cov-report=term-missing
        env:
          MONGODB_URI: mongodb://localhost:27017

      - name: Verify package installs cleanly
        run: |
          pip install --no-deps -e .
          python -c "from kanrec import KANRecModel, SymbolicExtractor, MongoSymbolicStore; print('OK')"

  # -- Gate 3: the artefact -------------------------------------------------
  # La guia del TFM pide un artefacto instalable. Este job construye la wheel
  # (la misma que se sube al entorno de Fabric), la valida, la instala en un
  # entorno LIMPIO -- no editable, sin el arbol de fuentes -- y comprueba que
  # se importa. Queda publicada como artefacto de la ejecucion y, en tags
  # v*, como Release de GitHub.
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: test
    # Necesario para que softprops/action-gh-release pueda crear la Release:
    # el GITHUB_TOKEN es de solo lectura por defecto.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the wheel in a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet dist/kanrec-*.whl
          cd /tmp   # fuera del repo: si importa, es la wheel, no el codigo fuente
          /tmp/clean/bin/python -c "import kanrec, kanrec.drift, kanrec.serving; from kanrec import KANRecModel, vectorize_model, DriftReference; print('wheel OK', kanrec.__version__)"

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: kanrec-wheel
          path: dist/*

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
