name: KAN-REC CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=kanrec --cov-report=term-missing
        env:
          MONGODB_URI: mongodb://localhost:27017

      - name: Verify package installs cleanly
        run: |
          pip install --no-deps -e .
          python -c "from kanrec import KANRecModel, SymbolicExtractor, MongoSymbolicStore; print('OK')"
